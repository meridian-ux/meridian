# ONE workspace. This is the fix.
#
# Before the merge these were seven separate pnpm roots, and @savvifi/meridian-
# proto-ts resolved to FIVE different versions across them — ^0.23.0 (web-react),
# ^0.24.0 (mui-kit), 0.21.0 (chat), ^0.13.0 (launchpad), ^0.19.0 (web). Caret on
# 0.x is minor-locked, so ^0.23.0 means >=0.23.0 <0.24.0 and those ranges are
# pairwise DISJOINT: installing web-react and mui-kit together did not risk two
# copies of PanelDescriptor, it guaranteed them. protobuf-es emits nominal types,
# so the two copies are mutually unassignable and a consumer could not fix it
# from its own package.json — which is why the estate accumulated three
# pnpm.overrides blocks, a check_single_copy.mjs script and
# strict-peer-dependencies=false, all of them working around the same thing.
#
# Inside one workspace with `workspace:*`, a second copy is not a bug to be
# guarded against. It is unrepresentable.
#
# `pnpm why @savvifi/meridian-proto-ts` returning exactly one version is the
# check that this held.
packages:
  - schemas
  - packages/*
  - site
