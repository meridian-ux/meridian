name: Verify bootstrap credentials

on: workflow_dispatch

permissions: {}

jobs:
  verify:
    if: github.repository == 'meridian-ux/meridian' && github.ref == 'refs/heads/verify-bootstrap-credentials'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: meridian-release
    steps:
      - name: Check registry authentication with read-only requests
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.MERIDIAN_BOOTSTRAP_NPM_TOKEN }}
          CRATES_BOOTSTRAP_TOKEN: ${{ secrets.MERIDIAN_BOOTSTRAP_CRATES_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())

          def get(url, authorization):
              headers = {"Accept": "application/json",
                         "User-Agent": "meridian-ux/meridian credential verification (GitHub Actions)"}
              if authorization:
                  headers["Authorization"] = authorization
              request = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with opener.open(request, timeout=15) as response:
                      return response.status, json.loads(response.read(65536))
              except urllib.error.HTTPError as error:
                  try:
                      return error.code, json.loads(error.read(65536))
                  except (ValueError, OSError):
                      return error.code, {}
              except (ValueError, OSError):
                  return 0, {}

          def npm_check(token):
              status, body = get("https://registry.npmjs.org/-/whoami", f"Bearer {token}")
              if status == 200 and isinstance(body, dict) and body.get("username") == "marshsavvi":
                  return True, "authenticated as the expected account"
              return False, f"expected identity unconfirmed (HTTP {status or 'unavailable'})"

          def crates_check(token):
              url = "https://crates.io/api/v1/me"
              status, body = get(url, token)
              # crates.io checks the token before enforcing this endpoint's cookie-only rule.
              # Confirm the rule's response differs from the anonymous control.
              def cookie_required(code, payload):
                  return code == 403 and payload == {
                      "errors": [{"detail": "this action can only be performed on the crates.io website"}]
                  }

              anonymous_status, anonymous_body = get(url, None)
              if (cookie_required(status, body) and anonymous_status == 403
                      and not cookie_required(anonymous_status, anonymous_body)):
                  return True, "token accepted before the cookie-only endpoint restriction"
              return False, f"authentication unconfirmed (HTTP {status or 'unavailable'})"

          results = []
          for label, variable, probe in (
              ("npm", "NPM_BOOTSTRAP_TOKEN", npm_check),
              ("crates.io", "CRATES_BOOTSTRAP_TOKEN", crates_check),
          ):
              token = os.environ.pop(variable, "")
              ok, detail = probe(token) if token else (False, "environment secret missing")
              print(f"{label}: {detail}")
              results.append(ok)
          print("These GET requests do not verify publish permissions.")
          raise SystemExit(0 if all(results) else 1)
          PY
