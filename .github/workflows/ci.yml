name: ci

# One primary workflow over the whole repo, replacing the scattering the merge absorbed —
# and, more to the point, COVERING WHAT NOTHING COVERED. Four of the ten repos
# folded in here had no CI whatsoever: meridian-web (7,716 lines, the entire
# web-components renderer), meridian-tui (3,828), meridian-uiview-core (1,911, a
# Bazel module two other repos depended on) and brand (1,080). About 14,500 lines
# with nothing gating a merge — which is also why three of them sat unbuildable
# for months behind a missing --experimental_isolated_extension_usages and nobody
# knew.
#
# Browser formatting now executes Rust by construction. A narrow pinned-core
# build supplies the same self-contained module that ships to npm; Node tests
# consume that artifact instead of maintaining a JavaScript formatter twin.
# Cargo and the full Bazel suite remain independent of the Node coverage job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  swiftui:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> .build/native-core/rust"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate canonical Swift bindings and test native views
        run: python3 tools/swiftui.py --ios
      - name: Swift dependency lock is current
        run: git diff --exit-code -- Package.resolved
      - name: Proposal-only Swift migration-consumer probe
        run: |
          set -euo pipefail
          node schemas/tools/affordance_migration_probe.mjs --canonical --keep > "$RUNNER_TEMP/swift-affordance-probe.json"
          probe_dir="$(jq -r .work "$RUNNER_TEMP/swift-affordance-probe.json")"
          generator_dir="$(swift build --package-path .build/checkouts/swift-protobuf --scratch-path .build/swift-protobuf-generator --show-bin-path)"
          python3 tools/affordance_swift_probe.py --scratch "$probe_dir" --generator "$generator_dir/protoc-gen-swift"

  affordance-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compiled Java migration-consumer and descriptor-ownership probe
        run: |
          set -euo pipefail
          node schemas/tools/affordance_migration_probe.mjs --canonical --keep > "$RUNNER_TEMP/affordance-probe.json"
          probe_dir="$(jq -r .work "$RUNNER_TEMP/affordance-probe.json")"
          protoc_archive="$RUNNER_TEMP/meridian-protoc.zip"
          curl --fail --location --silent --show-error -o "$protoc_archive" https://github.com/protocolbuffers/protobuf/releases/download/v33.4/protoc-33.4-linux-x86_64.zip
          printf '%s  %s\n' c0040ea9aef08fdeb2c74ca609b18d5fdbfc44ea0042fcfbfb38860d35f7dd66 "$protoc_archive" | sha256sum --check -
          unzip -q "$protoc_archive" -d "$RUNNER_TEMP/meridian-protoc"
          runtime_jar="$RUNNER_TEMP/protobuf-java-4.33.4.jar"
          curl --fail --location --silent --show-error -o "$runtime_jar" https://repo.maven.apache.org/maven2/com/google/protobuf/protobuf-java/4.33.4/protobuf-java-4.33.4.jar
          python3 tools/affordance_java_probe.py --scratch "$probe_dir" \
            --protoc "$RUNNER_TEMP/meridian-protoc/bin/protoc" \
            --java "$JAVA_HOME/bin/java" --javac "$JAVA_HOME/bin/javac" --runtime-jar "$runtime_jar"

  affordance-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rust proposal failure-classifier tests
        run: python3 -m unittest tools/test_affordance_rust_probe.py
      - name: Actual canonical Rust candidate workspace tests
        run: |
          set -euo pipefail
          node schemas/tools/affordance_migration_probe.mjs --canonical --keep > "$RUNNER_TEMP/rust-affordance-probe.json"
          probe_dir="$(jq -r .work "$RUNNER_TEMP/rust-affordance-probe.json")"
          python3 -u tools/affordance_rust_probe.py --canonical --scratch "$probe_dir"

  core-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Build the default synchronous formatter
        run: bazel build --announce_rc=false //schemas:core_runtime
      - uses: actions/upload-artifact@v4
        with:
          name: core-runtime
          path: |
            bazel-bin/schemas/src/uiview/generated/meridian_uiview.js
            bazel-bin/schemas/src/uiview/generated/meridian_uiview.d.ts
          if-no-files-found: error
          retention-days: 1

  node:
    runs-on: ubuntu-latest
    needs: [core-runtime]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # NO `version:` input, on purpose. package.json declares
      # `packageManager: pnpm@10.25.0`, and pnpm/action-setup HARD-ERRORS when a
      # version arrives from both places ("Multiple versions of pnpm specified") —
      # it dies in readTarget before installing anything, in about six seconds.
      #
      # This estate already learned this once: b43dd04 "ci: let packageManager be
      # the only pnpm version declaration". The merge reintroduced it, because
      # hoisting packageManager to the root (corepack reads only the root) made an
      # input that was previously correct into a conflict.
      - uses: pnpm/action-setup@v4

      # `prepare` runs `pnpm codegen`, so this also generates
      # packages/proto-ts — which is NOT committed, deliberately: Bazel is the
      # authority for what ships, and a checked-in copy would be a second producer
      # of the same types with no gate keeping them equal. That is exactly how
      # meridian-k8s's vendored proto tree drifted from schemas 0.17.0 and lost
      # Slot.sub_view without anything noticing.
      - name: Install (runs codegen via prepare)
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: core-runtime
          path: ${{ runner.temp }}/meridian-core-runtime
      - name: Prepare the same core runtime used by published packages
        run: node schemas/tools/prepare_core_runtime.mjs "$RUNNER_TEMP/meridian-core-runtime"

      # THE headline check. @savvifi/meridian-proto-ts resolved to FIVE versions
      # across these packages before the merge (^0.23.0 / ^0.24.0 / 0.21.0 /
      # ^0.13.0 / ^0.19.0), and caret on 0.x is minor-locked so those ranges are
      # pairwise DISJOINT — installing web-react and mui-kit together did not risk
      # two copies of a nominally-typed PanelDescriptor, it guaranteed them.
      # If a registry copy ever reappears in the store, this fails.
      - name: Exactly one @savvifi copy
        run: |
          set -euo pipefail
          count=$(find node_modules/.pnpm -maxdepth 1 -name '@savvifi*' | wc -l)
          if [ "$count" != "0" ]; then
            echo "::error::$count @savvifi package(s) resolved from the REGISTRY."
            echo "Every internal dependency must be workspace:* so it links to the"
            echo "package in this repo. Found:"
            find node_modules/.pnpm -maxdepth 1 -name '@savvifi*'
            exit 1
          fi
          echo "0 registry copies — all internal deps link to workspace packages."

      # Guards what `npm publish` actually ships. The development manifests carry
      # workspace:*, which cannot be resolved from the detached $RUNNER_TEMP copy
      # the release job publishes from; the generated ones carry real versions.
      # A stale generated manifest is the bug that shipped in 0.14.0 and 0.15.0.
      - name: Published manifests are current
        run: python3 tools/publish_manifests.py --check

      - name: Published manifest transformation tests
        run: python3 -m unittest tools/test_publish_manifests.py

      # check_versions.py is RETIRED, not moved. It compared
      # schemas.package.json and proto-ts.package.json against MODULE.bazel's
      # version and against each other — a detector for drift between manifests
      # it had no power to fix, written after that drift shipped in 0.14.0 and
      # 0.15.0. publish_manifests.py GENERATES those manifests from the
      # development ones, so the drift it existed to catch is now unrepresentable,
      # and it covers all six packages rather than two.

      - name: Renderer coverage
        run: node schemas/tools/check_coverage.mjs

      - name: Renderer catalog
        run: node schemas/tools/check_renderer_catalog.mjs

      - name: Design vocabulary and generated inventory
        run: node schemas/tools/design_vocabulary.mjs --check

      - name: Conformance corpus
        run: node schemas/tools/check_conformance_corpus.mjs

      - name: Stateful corpus protobuf runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned conformance protobuf runtime
        run: python3 -m pip install -r tools/conformance_requirements.txt

      - name: Stateful view corpus and readable twins are current
        run: |
          python3 tools/stateful_corpus.py
          python3 -m unittest tools/test_stateful_corpus.py
          python3 tools/layout_corpus.py
          python3 -m unittest tools/test_layout_corpus.py

      - name: Native and WASM core corpus is current
        run: node schemas/tools/write_core_corpus.mjs

      - name: Coverage matrix
        run: node schemas/tools/check_coverage.mjs --matrix

      # ROADMAP.md projects the coverage manifest for humans. Keep that generated
      # view honest so parity changes cannot land with a stale roadmap.
      - name: Roadmap matrix is current
        run: python3 tools/roadmap_matrix.py --check

      - name: Roadmap matrix transformation tests
        run: python3 -m unittest tools/test_roadmap_matrix.py

      - name: Mirror conformance self-test
        run: node --test "schemas/tools/*.test.mjs"

      - name: Proposal-only Affordance migration, facades, and real TS consumers
        run: node schemas/tools/affordance_consumer_probe.mjs

      - name: Admission gate
        run: pnpm --filter @savvifi/meridian-schemas exec tsc -p src/uiview/tsconfig.test.json --noEmit

      - name: Typecheck
        run: |
          pnpm --filter @savvifi/meridian-schemas exec tsc -p src/uiview/tsconfig.json --noEmit
          pnpm --filter @savvifi/meridian-schemas exec tsc -p src/theme/tsconfig.test.json --noEmit
          pnpm --filter @savvifi/meridian-web exec tsc -p tsconfig.json --noEmit
          pnpm --filter @savvifi/meridian-web-react exec tsc -p tsconfig.json --noEmit
          pnpm --filter @savvifi/meridian-web-react exec tsc -p tsconfig.theme-test.json --noEmit
          pnpm --filter @savvifi/meridian-mui-kit exec tsc -p tsconfig.json --noEmit

      # Six package suites report coverage independently. The schemas seam was
      # previously compiled and run with node:test; it now uses Vitest so it is
      # included rather than silently disappearing from package coverage.
      - name: Coverage — schemas
        run: pnpm --filter @savvifi/meridian-schemas exec vitest run src/uiview/admission.test.ts src/uiview/navigation.test.ts src/uiview/prompt_response.test.ts --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../coverage/schemas --coverage.include='src/uiview/**/*.{ts,tsx}' --coverage.exclude='src/uiview/**/*.test.ts'
      - name: Coverage — chat
        run: pnpm --filter @savvifi/meridian-chat exec vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../../coverage/chat --coverage.include='src/**/*.{js,jsx,ts,tsx}'
      - name: Coverage — launchpad
        run: pnpm --filter @savvifi/meridian-launchpad exec vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../../coverage/launchpad --coverage.include='src/**/*.{js,jsx,ts,tsx}'
      - name: Coverage — MUI kit
        run: pnpm --filter @savvifi/meridian-mui-kit exec vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../../coverage/mui-kit --coverage.include='src/**/*.{js,jsx,ts,tsx}' --coverage.exclude='src/**/*.test.{ts,tsx}'
      - name: Coverage — web components
        run: pnpm --filter @savvifi/meridian-web exec vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../../coverage/web --coverage.include='src/**/*.{js,jsx,ts,tsx}' --exclude=tests/conformance_wasm.test.ts
      - name: Coverage — web React
        run: pnpm --filter @savvifi/meridian-web-react exec vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory=../../coverage/web-react --coverage.include='src/**/*.{js,jsx,ts,tsx}' --coverage.exclude='src/**/*.test.{ts,tsx}'

      - name: Upload JavaScript coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-raw
          path: coverage
          if-no-files-found: error
          retention-days: 1

      # Run the committed browser semantic snapshots through their shared,
      # non-destructive workflow. This intentionally omits both --update and
      # --bazel: CI verifies goldens here without rewriting them or depending on
      # the separate Bazel job/toolchain.
      - name: Browser semantic snapshots
        run: pnpm conformance:snapshots

      - name: Test floor
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node schemas/tools/check_test_floor.mjs --base-ref "$BASE_REF"

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # 73 tests: 43 tui, 27 core, 3 descriptor-set guards, 3 theme-proto
      # contract, 3 render. `cargo test --workspace` has never meant anything
      # before — crates/tui named crates only Bazel could produce, so it could not
      # be built at all, which is why it had no [[bin]].
      - name: cargo test
        run: cargo test --workspace --all-targets

      # Keep the cargo-fuzz target and its standalone lockfile buildable in
      # ordinary stable CI, independently of the sanitizer-backed smoke job.
      - name: Descriptor fuzz target compiles
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bin panel_descriptor

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build the extracted archives, including unpublished first-party deps in
      # Cargo's temporary workspace registry. This never invokes cargo publish.
      # Keep its registry-origin artifacts out of the workspace build cache:
      # mixing these with path-origin crates can duplicate prost trait identity.
      - name: Rust distribution archives
        run: cargo package --workspace --locked --target-dir "$RUNNER_TEMP/meridian-crate-packages"

      # The binary exists now. Smoke it: --help must work, and a non-descriptor
      # must be REJECTED with a readable error rather than a panic.
      - name: meridian-tui smoke
        run: |
          set -euo pipefail
          cargo build --bin meridian-tui
          ./target/debug/meridian-tui --help > /dev/null
          echo "not a proto" > /tmp/junk.bin
          # Captured, not piped. Under `set -o pipefail` a pipeline inherits the
          # NON-ZERO exit meridian-tui returns *because* it rejected the file, so
          # `if prog | grep -q ...` reports failure however the grep went. The
          # first version of this step failed for exactly that reason — the test
          # was wrong, the binary was right.
          out="$(./target/debug/meridian-tui /tmp/junk.bin 2>&1 || true)"
          case "$out" in
            *"not a wire-format"*) echo "rejects a non-descriptor cleanly" ;;
            *) echo "::error::expected a wire-format complaint, got: $out"; exit 1 ;;
          esac

      - name: Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Workspace coverage
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --workspace --all-targets --lcov --output-path coverage/rust/lcov.info

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust-raw
          path: coverage
          if-no-files-found: error
          retention-days: 1

  native-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-04-29
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Corpus seeding tests
        run: node --test fuzz/seed_corpus.test.mjs
      - name: Install the pinned sanitizer toolchain and runner
        env:
          FUZZ_WORK: ${{ runner.temp }}/meridian-descriptor-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked --root "$FUZZ_WORK/tools"
      - name: Fetch locked fuzz dependencies
        run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Seed and run the bounded native descriptor campaign
        env:
          FUZZ_WORK: ${{ runner.temp }}/meridian-descriptor-fuzz
        run: |
          set -euo pipefail
          mkdir -p "$FUZZ_WORK/corpus" "$FUZZ_WORK/artifacts"
          node fuzz/seed_corpus.mjs "$FUZZ_WORK/corpus"
          CARGO_NET_OFFLINE=true "$FUZZ_WORK/tools/bin/cargo-fuzz" run \
            --fuzz-dir fuzz --target-dir "$FUZZ_WORK/target" --sanitizer address \
            panel_descriptor "$FUZZ_WORK/corpus" -- \
            -max_total_time=60 -timeout=5 -rss_limit_mb=2048 -max_len=65536 \
            -seed=1 -verbosity=0 -print_final_stats=1 \
            -artifact_prefix="$FUZZ_WORK/artifacts/"
          git diff --exit-code -- Cargo.lock fuzz/Cargo.lock schemas/conformance/binpb schemas/conformance/layout schemas/conformance/fixtures
      - name: Preserve crash reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: descriptor-fuzz-crashes
          path: ${{ runner.temp }}/meridian-descriptor-fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 7

  coverage-summary:
    runs-on: ubuntu-latest
    needs: [node, cargo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*-raw
          path: coverage
          merge-multiple: true
      - name: Build coverage summary
        run: node tools/coverage_summary.mjs coverage coverage-summary
      - name: Upload single coverage summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary
          if-no-files-found: error
          retention-days: 14

  bazel:
    runs-on: ubuntu-latest
    # Bazel needs registry.tbzl.dev for brando / rules_chrome / rules_tectonic /
    # rules_astro / rules_vite, none of which have a BCR entry. Slower and more
    # dependent than the other two jobs, so it runs alongside rather than in front.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      # Cheapest first, and it needs no Bazel at all. A BUILD file exporting a
      # file that does not exist makes its whole PACKAGE fail to load, and the
      # error names the file rather than the damage — in this repo that was two
      # dead lines in crates/core/rust/BUILD.bazel poisoning :prost_toolchain, and
      # so every target, for a full CI round.
      - name: exports_files entries exist
        run: python3 tools/check_exports.py

      # Resolution first and separately: it is fast, it needs no source archives,
      # and it is what catches the merge-shaped failures — use_repo collisions,
      # duplicate extension names, toolchain conflicts.
      # Resolve with error mode from the outset: plain `bazel mod deps` can
      # rewrite MODULE.bazel.lock and make a later error-mode check vacuous.
      - name: Module graph resolves with committed lock
        run: bazel mod deps --lockfile_mode=error > /dev/null

      - name: bazel test //...
        run: bazel test //... --test_output=errors

      # Explicit labels also fail if an owner is deleted or tagged manual,
      # either of which could otherwise remove it from the wildcard suite.
      - name: Required panel render proofs
        run: node schemas/tools/panel_evidence.mjs --verify

      - name: Required composed-layout proofs
        run: bazel test --announce_rc=false //packages/mui-kit:layout_browser_test //packages/mui-kit:conversation_browser_test //packages/mui-kit:stateful_geometry_test //crates/tui/rust/tui:view_composition_test --test_output=errors

      - name: Detached web-components npm consumer
        run: |
          bazel build --announce_rc=false //packages/web:pkg //schemas:schemas_pkg //schemas/proto:proto_ts_pkg
          node tools/check_web_package.mjs

  registry-admission:
    runs-on: ubuntu-latest
    # The D2/D3 checks are not zero-finding tests yet. Match bazel-registry's
    # PR-time ratchet: project the published registry and a copy with Meridian's
    # candidate MODULE.bazel substituted, then fail only if a per-gate count
    # increases. Keep this job unfiltered so it always reports a check run;
    # irrelevant PRs short-circuit inside the job instead.
    env:
      GATE_REF: 0c0778949b3f88dfe94e87de664092bb177ef067
      REGISTRY_REF: ce604dd13a37998da2538fc3a66dc526ab2dba47
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registry admission staging tests
        run: python3 -m unittest tools/test_registry_admission_stage.py

      - name: Does this change the module graph?
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          if git diff --quiet "$base" HEAD -- MODULE.bazel; then
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
            echo 'MODULE.bazel is unchanged; registry admission is unaffected.'
          else
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the published registry snapshot
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: tomato-bazel/bazel-registry
          ref: ${{ env.REGISTRY_REF }}
          path: _registry
          fetch-depth: 1

      - name: Check out the pinned admission gates
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/checkout@v4
        with:
          repository: tomato-bazel/gate
          ref: ${{ env.GATE_REF }}
          path: _gate

      - uses: bazel-contrib/setup-bazel@0.10.0
        if: steps.scope.outputs.relevant == 'true'
        with:
          bazelisk-cache: true
          disk-cache: registry-admission
          repository-cache: true

      - name: Materialize published and candidate registry trees
        if: steps.scope.outputs.relevant == 'true'
        working-directory: _registry
        env:
          WORKSPACE_MODULE: ${{ github.workspace }}/MODULE.bazel
        run: |
          set -euo pipefail
          git worktree add /tmp/reg/base HEAD
          git worktree add /tmp/reg/head HEAD
          python3 "$GITHUB_WORKSPACE/tools/registry_admission_stage.py" \
            "$WORKSPACE_MODULE" /tmp/reg/head/modules/meridian

      - name: Project and report — published, then candidate
        if: steps.scope.outputs.relevant == 'true'
        working-directory: _gate
        run: |
          set -euo pipefail
          for side in base head; do
            bazel run //crates/gate-rdf:project -- \
              "/tmp/reg/$side" "$PWD/gates/testdata/registry.ttl" \
              --vendor "$PWD/vendor/bcr" --allow-unresolved
            bazel build //gates:report
            cp bazel-bin/gates/report.binpb "/tmp/$side.binpb"
            chmod u+w "/tmp/$side.binpb"
          done

      - name: Ratchet registry admission
        if: steps.scope.outputs.relevant == 'true'
        working-directory: _gate
        run: |
          set -euo pipefail
