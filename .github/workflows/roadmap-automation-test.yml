name: Roadmap automation fixtures

on:
  pull_request:
    paths:
      - tools/roadmap_automation*.mjs
      - .github/workflows/roadmap-*.yml
      - docs/ROADMAP_AUTOMATION*.md
  push:
    branches: [main]
    paths:
      - tools/roadmap_automation*.mjs
      - .github/workflows/roadmap-*.yml
      - docs/ROADMAP_AUTOMATION*.md

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - run: node --test tools/roadmap_automation.test.mjs
      # No App token, secret, API call, or live Project mutation in these tests.
