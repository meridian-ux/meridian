name: Release rehearsal and gated publication

# Keep this filename: npm trusted publishers bind to publish.yml.
# No tag, PR, or default dispatch publishes. Registry setup and enabling the
# protected publication lane require separate owner approval.
on:
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - tools/release.py
      - tools/test_release.py
      - DISTRIBUTION.md
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the verified set (requires owner enable flag and protected environment approval)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true
      - name: Publication manifests, versions and tag agree
        run: |
          set -euo pipefail
          python3 tools/publish_manifests.py --check
          VERSION=$(python3 -c 'import sys; sys.path.insert(0,"tools"); from release import release_version; print(release_version())')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo 'Tag and module version disagree' >&2
            exit 1
          fi
      - name: Install and generate the real source consumers
        run: |
          set -euo pipefail
          npm install -g npm@11.21.1
          pnpm install --frozen-lockfile
          pnpm codegen
          pnpm core:prepare
      - name: Release contract gates
        run: |
          set -euo pipefail
          node schemas/tools/check_coverage.mjs
          node schemas/tools/check_renderer_catalog.mjs
          node schemas/tools/check_test_floor.mjs
          python3 tools/roadmap_matrix.py --check
          python3 -m unittest tools/test_publish_manifests.py tools/test_release.py
          node --test 'schemas/tools/*.test.mjs' tools/roadmap_automation.test.mjs
          pnpm exec buf build schemas --as-file-descriptor-set --exclude-source-info -o "$RUNNER_TEMP/release.binpb"
          node schemas/tools/compatibility_line.mjs --line v1-maintenance-proposal --image "$RUNNER_TEMP/release.binpb"
          pnpm --filter @savvifi/meridian-schemas test
          pnpm -r --filter './packages/**' test
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check
      - name: Build all npm package inputs
        run: |
          bazel build --noannounce_rc --lockfile_mode=error \
            //schemas/proto:proto_ts_pkg //schemas:schemas_pkg \
            //packages/web:pkg //packages/web-react:pkg \
            //packages/chat:pkg //packages/launchpad:pkg
      - name: Rehearse all seven npm packages and three Rust crates
        run: python3 tools/release.py prepare --artifacts "$RUNNER_TEMP/release-packages"
      - name: Retain the complete verified set
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish == true &&
      github.ref_type == 'tag' && github.repository == 'meridian-ux/meridian' &&
      vars.MERIDIAN_RELEASE_PUBLISH_ENABLED == 'true'
    environment: meridian-release
    concurrency:
      group: meridian-registry-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      MERIDIAN_RELEASE_PUBLISH_ENABLED: ${{ vars.MERIDIAN_RELEASE_PUBLISH_ENABLED }}
      MERIDIAN_RELEASE_PUBLISH_REQUESTED: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ github.sha }}
          path: ${{ runner.temp }}/release-packages
      - name: Verify the complete set and explicit execution authority
        run: |
          set -euo pipefail
          npm install -g npm@11.21.1
          python3 tools/release.py authorize --artifacts "$RUNNER_TEMP/release-packages"
      - name: Rehearse Rust packages and compare the retained bytes
        run: >-
          python3 tools/release.py rehearse-rust
          --artifacts "$RUNNER_TEMP/release-packages"
          --rust-target "$RUNNER_TEMP/release-crates"
      - name: Obtain short-lived crates.io credential
        id: crates
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6; revoked by post step
      - name: Publish the verified lockstep set
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: >-
          python3 tools/release.py publish
          --artifacts "$RUNNER_TEMP/release-packages"
          --rust-target "$RUNNER_TEMP/release-crates"
