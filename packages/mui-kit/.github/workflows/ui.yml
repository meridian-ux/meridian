name: ui

# Real-browser UI gate + visual catalog. Runs the 0-tolerance browser test in
# hermetic Chrome for Testing (rules_chrome), then builds the rules_tectonic
# catalog PDF and publishes it as a downloadable workflow artifact — and attaches
# it to the GitHub release when a `catalog-*` tag is pushed.
on:
  push:
    branches: [main]
    tags: ["catalog-*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # needed to attach the PDF to a release on catalog-* tags

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # System libraries Chrome for Testing needs on Linux. Playwright knows the
      # right set per Ubuntu version, so let it install them (chromium deps only).
      - name: Chrome system dependencies
        run: npx --yes playwright@1.59.0 install-deps chromium

      # pnpm-lock.yaml is the ONLY dependency tree Bazel sees (MODULE.bazel's
      # npm_translate_lock reads it). package.json is not consulted, so a bump that
      # edits package.json without regenerating the lock leaves the browser bundle
      # silently linked against the OLD packages — which is exactly how the 0.17
      # RepeatedField rename shipped a red main. Fail fast and loudly instead.
      - name: pnpm-lock.yaml is in sync with package.json
        run: npx --yes pnpm@10 install --frozen-lockfile --lockfile-only

      # rules_chrome / rules_tectonic resolve from the fastverk registry; the rest
      # from BCR. (The repo .bazelrc leaves registries to the environment.)
      # bazelisk is preinstalled on GitHub-hosted runners as `bazel`.
      - name: Real-browser UI test (hermetic Chrome)
        run: |
          bazel test //:browser_test \
            --registry=https://registry.fastverk.com/ \
            --registry=https://bcr.bazel.build/ \
            --test_output=errors

      - name: Build the visual catalog
        run: |
          bazel build //:catalog \
            --registry=https://registry.fastverk.com/ \
            --registry=https://bcr.bazel.build/
          cp -L bazel-bin/catalog.pdf meridian-mui-kit-catalog.pdf

      - name: Upload catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-mui-kit-catalog
          path: meridian-mui-kit-catalog.pdf
          if-no-files-found: error

      - name: Attach catalog to release (catalog-* tags)
        if: startsWith(github.ref, 'refs/tags/catalog-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" meridian-mui-kit-catalog.pdf --clobber --repo "${GITHUB_REPOSITORY}"
