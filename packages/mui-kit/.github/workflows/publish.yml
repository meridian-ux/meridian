name: publish

# OIDC trusted publishing to npmjs. The 0.1.x line was seeded with a token; every
# subsequent publish flows through here tokenlessly with a provenance attestation.
# Configure a Trusted Publisher on @savvifi/meridian-mui-kit (npmjs Settings):
#   Provider GitHub Actions · Owner meridian-ux · Repo meridian-mui-kit · Workflow publish.yml
# (mui-kit builds its dist with tsc via `pnpm build`, then `npm publish`; the Bazel
# targets in this repo are the browser test + the visual catalog, not the package.)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag. Blank ⇒ derived from the version (prerelease → its identifier, e.g. 0.8.0-rc.1 → rc; else latest)."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm + install pnpm
        run: npm install -g npm@latest pnpm@10
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - name: Publish (OIDC provenance)
        # Pass an explicit dist-tag. npm defaults to `latest` regardless of the
        # version string — it does NOT infer a tag from a prerelease — so a bare
        # publish of 0.8.0-rc.1 would point `latest` at a release candidate. Derive
        # it from the version unless the dispatch overrides it (keeps tag pushes safe).
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            PRERELEASE="${VERSION#*-}"
            if [ "$PRERELEASE" = "$VERSION" ]; then TAG="latest"; else TAG="${PRERELEASE%%.*}"; fi
          fi
          echo "publishing $VERSION with dist-tag '$TAG'"
          npm publish --access public --tag "$TAG"
