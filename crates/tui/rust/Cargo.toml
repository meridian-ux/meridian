# Cargo workspace for meridian-tui. The authoritative build is Bazel — this
# Cargo.toml exists so crate_universe can read manifests (to resolve the native
# crates: ratatui, crossterm, …).
#
#   tui/  — ratatui-based renderer. The first-party `meridian_uiview` core +
#           `theme_proto` come cross-repo from meridian-uiview-core via the Bazel
#           BUILD deps (NOT a cargo path dep), so standalone `cargo build` is not
#           wired here; Bazel is authoritative.
#
# Build (Bazel — hermetic):
#   bazel build //rust/tui
#   bazel test  //rust/tui:tui_test
#
# Repin the crate-universe lockfile after touching this file:
#   CARGO_BAZEL_REPIN=1 bazel build //rust/...
[workspace]
resolver = "2"
members = [
    "tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meridian-ux/meridian-tui"

[workspace.dependencies]
ratatui = "0.29"
crossterm = "0.28"
prost = "0.13"
prost-build = "0.13"
regex = "1"
# serde_json intentionally omitted — it comes cross-repo via the Bazel alias
# `@meridian_uiview_core//rust:serde_json` (one shared crate instance).
thiserror = "2"
