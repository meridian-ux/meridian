syntax = "proto3";
package meridian.ui.v1;
option java_multiple_files = true;
option java_package = "meridian.ui.v1";
option java_outer_classname = "InteractionProto";
import "google/api/field_behavior.proto";
import "proto/chart.proto";
import "proto/choice.proto";
import "proto/copy_value.proto";
import "proto/form.proto";
import "proto/gallery.proto";
import "proto/grammar.proto";
import "proto/llm_prompt.proto";
import "proto/media.proto";
import "proto/prompt.proto";
import "proto/resource_card.proto";
import "proto/rpc.proto";
import "proto/snippet.proto";
import "proto/stat.proto";
import "proto/stream.proto";
import "proto/terminal.proto";
import "proto/value.proto";

// Canonical interaction compilation unit. Former source files remain public
// import facades. Existing type names and tags stay stable; file ownership
// intentionally changes for this candidate. Rendering grants no authority.
message Affordance {
  // Stable identifier (e.g. "install", "install-insiders").
  string id = 1 [(google.api.field_behavior) = OPTIONAL];
  // Display label ("Add to Cursor", "Install in VS Code").
  string label = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional one-liner shown near the affordance.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional icon key the host maps to a vector glyph (e.g. "download").
  string icon = 4 [(google.api.field_behavior) = OPTIONAL];
  // Typed intent, not permission. Absent/unknown intents are visibly denied.
  oneof invoke {
    // A URI opened only through host-admitted navigation.
    string uri = 5;
    // A host-admitted command. Denial must never fall back to clipboard copy.
    string command = 6;
    // User-triggered calls use mutation admission, including Get/List.
    RpcCall rpc = 10;
    // Host-resolved navigation; not an implicit browser URL assignment.
    Navigate navigate = 11;
    // Open only after admission; passive rendering must not mount this panel.
    PanelDescriptor open_panel = 12;
    // A host-owned view ID, never inferred from a legacy semantic action ID.
    string open_view = 13;
    // Literal clipboard payload, including empty. Never disclose it in logs.
    string copy = 14;
  }
  // Prominence hint. The renderer maps it to its own weighting (web = contained
  // vs outlined button, tui = highlighted vs plain keybinding).
  AffordanceStyle style = 7 [deprecated = true, (google.api.field_behavior) = OPTIONAL];
  // Semantic color, independent of prominence and invocation authority. Absent
  // retains legacy styling; present unspecified/unknown selects neutral.
  optional Tone tone = 8 [(google.api.field_behavior) = OPTIONAL];
  // Absence adapts legacy style. Present unspecified/unknown uses ordinary
  // surface prominence, never reviving a legacy PRIMARY hint.
  optional Emphasis emphasis = 9 [(google.api.field_behavior) = OPTIONAL];
  // Explicit presence overrides legacy placement, including unspecified.
  optional ActionPlacement placement = 15;
  // Evaluate against the current subject context again at activation time.
  RowFilter enabled_when = 16;
  // Refresh only after success; present false is authoritative.
  optional bool refresh_on_success = 17;
}

// Prominence only: not color, placement, operational state, or permission.
enum Emphasis {
  EMPHASIS_UNSPECIFIED = 0;
  EMPHASIS_PRIMARY = 1;
  EMPHASIS_SECONDARY = 2;
}

// How prominently an affordance renders.
enum AffordanceStyle {
  option deprecated = true;
  AFFORDANCE_STYLE_UNSPECIFIED = 0;
  // The primary call to action.
  AFFORDANCE_STYLE_PRIMARY = 1;
  // A secondary / alternate affordance.
  AFFORDANCE_STYLE_SECONDARY = 2;
}

// PanelDescriptor body variant: a panel that is a single Affordance (plus
// optional lead copy). The star primitive `Affordance` is reused nested by
// `ConnectTarget` and `CatalogItem`; this wrapper exposes it as a standalone
// panel shape, matching the `*Panel` convention of the other body variants.
message ActionPanel {
  // The affordance to render.
  Affordance action = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional description shown above the affordance.
  string description = 2 [(google.api.field_behavior) = OPTIONAL];
}

message CatalogPanel {
  // The items, in display order.
  repeated CatalogItem items = 1 [(google.api.field_behavior) = REQUIRED];
  // Presentation hint; renderers substitute a modality-appropriate idiom.
  CatalogStyle style = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional placeholder shown when `items` is empty.
  string placeholder = 3 [(google.api.field_behavior) = OPTIONAL];
}

// One catalog item.
message CatalogItem {
  // Stable identifier.
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Primary label / name.
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional description / blurb.
  string description = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional category / kind chip (e.g. "tool", "resource").
  string tag = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional status badge (e.g. "connected", "Next", "beta"). Empty = no badge.
  string state = 5 [(google.api.field_behavior) = OPTIONAL];
  // Optional icon key the host maps to a vector glyph.
  string icon = 6 [(google.api.field_behavior) = OPTIONAL];
  // Optional per-item affordance (e.g. "Open", "Connect").
  Affordance action = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Presentation hint for a CatalogPanel. Advisory.
enum CatalogStyle {
  CATALOG_STYLE_UNSPECIFIED = 0;
  // A responsive grid of cards (web default).
  CATALOG_STYLE_GRID = 1;
  // A vertical list (tui default; chat renders as bullets).
  CATALOG_STYLE_LIST = 2;
}

message Launchpad {
  // Command groups, in display order. A renderer that can't group renders the
  // groups' commands as one flat list.
  repeated CommandGroup groups = 1 [(google.api.field_behavior) = REQUIRED];
  // Placeholder copy for the search input (e.g. "Search or jump to…").
  string placeholder = 2 [(google.api.field_behavior) = OPTIONAL];
  // Command ids to surface first when the search box is empty (recents /
  // pinned), in display order. Ids not present in `groups` are ignored.
  repeated string default_command_ids = 3 [(google.api.field_behavior) = OPTIONAL];
}

// A named section of commands (e.g. "Create", "Navigate", "Recent").
message CommandGroup {
  // Stable id (routing + telemetry).
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Display heading (resolved copy). Empty ⇒ an unlabeled group.
  string title = 2 [(google.api.field_behavior) = OPTIONAL];
  // The commands in this group, in display order.
  repeated Command commands = 3 [(google.api.field_behavior) = REQUIRED];
}

// One runnable command: what it's called, how it's matched, and what it does.
message Command {
  // Stable id (routing + telemetry; referenced by Launchpad.default_command_ids).
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Primary label (resolved copy).
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional secondary line (e.g. the entity type, a description).
  string subtitle = 3 [(google.api.field_behavior) = OPTIONAL];
  // Extra match terms beyond the title (synonyms, abbreviations) — the fuzzy
  // filter searches title + subtitle + keywords.
  repeated string keywords = 4 [(google.api.field_behavior) = OPTIONAL];
  // Icon-seam key the host maps to a glyph (e.g. "plus", "search"). Optional.
  string icon = 5 [(google.api.field_behavior) = OPTIONAL];
  // Per-command accelerator shown as a kbd hint (e.g. "$mod+K", "g p"). Advisory
  // — the host wires the actual keybinding. Distinct from the launchpad's own
  // open gesture.
  string shortcut = 6 [(google.api.field_behavior) = OPTIONAL];
  // Optional URL-state hint for hosts whose palette is URL-driven (a studio
  // studio palette encodes state as `?cmd=<entityType>/<mode>`). Orthogonal to
  // `action`: a host that round-trips palette state through the URL sets the
  // link when the command is chosen; a host that runs `action` directly ignores it.
  string deep_link = 7 [(google.api.field_behavior) = OPTIONAL];
  // What running the command does. Exactly one arm.
  oneof action {
    // Fire an RPC directly through the host's RpcInvoker (e.g. delete, export,
    // re-run). Same primitive as ViewDescriptor.Action.call.
    RpcCall rpc = 8 [deprecated = true];
    // Open a panel in a focused step (a create/edit FormPanel, a confirm
    // PromptPanel, a wizard). The host renders it through its ComponentKit /
    // PanelRenderer, then returns to the palette or dismisses.
    OpenPanel open_panel = 9 [deprecated = true];
    // Navigate to a ViewDescriptor (view.proto) by id — the same target a
    // NavNode leaf uses.
    string open_view_id = 10 [deprecated = true];
    // Navigate to a raw route/href the host resolves (its router / hrefResolver).
    Navigate navigate = 11 [deprecated = true];
  }
  Affordance affordance = 12;
}

// Open a panel as a focused step of the palette.
message OpenPanel {
  // The panel to render (e.g. a FormPanel in EDIT mode with prefilled fields).
  PanelDescriptor panel = 1 [(google.api.field_behavior) = REQUIRED];
}

// Navigate to a host-resolved route.
message Navigate {
  // A client route or href (e.g. "/products", "https://…"). The host's router /
  // hrefResolver interprets it.
  string route = 1 [(google.api.field_behavior) = REQUIRED];
}

message ConnectFlowPanel {
  // Optional intro copy shown above the target picker.
  string prompt = 1 [(google.api.field_behavior) = OPTIONAL];
  // The connection targets to choose among, in display order.
  repeated ConnectTarget targets = 2 [(google.api.field_behavior) = REQUIRED];
  // Id of the target selected by default (else the first target).
  string default_target_id = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional placeholder shown when `targets` is empty.
  string placeholder = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional shared endpoint, rendered once (e.g. the endpoint "chip" every
  // target points at). Copyable via the CopyValue affordance.
  CopyValue endpoint = 5 [(google.api.field_behavior) = OPTIONAL];
}

// One connection target: a Choice option that yields connect affordances +
// config snippets.
message ConnectTarget {
  // Stable identifier (e.g. "cursor", "vscode").
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Short label for the Choice/tab (e.g. "Cursor").
  string label = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional longer heading shown when the target is selected
  // (e.g. "VS Code · Copilot").
  string name = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional description / setup note.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional icon key the host maps to a vector glyph.
  string icon = 5 [(google.api.field_behavior) = OPTIONAL];
  // One-click connect affordances (e.g. an "Add to Cursor" deep-link, plus an
  // alternate). Optional — targets without a one-click path expose only the
  // config snippet(s).
  repeated Affordance actions = 6 [(google.api.field_behavior) = OPTIONAL];
  // Config snippets to copy (e.g. the mcp.json / config.toml block). Optional.
  repeated Snippet configs = 7 [(google.api.field_behavior) = OPTIONAL];
}

message LroPanel {
  // Initial RPC. Must return `google.longrunning.Operation`.
  RpcCall start = 1 [(google.api.field_behavior) = REQUIRED];
  // Fully-qualified proto type name (as it appears in
  // Operation.metadata.type_url after the URL prefix) the metadata
  // unpacks to, e.g. "pinax.knowledge.v1.GenerateKnowledgeProbesMetadata".
  string metadata_type = 2 [(google.api.field_behavior) = REQUIRED];
  // Same, for the final Operation.response.
  string response_type = 3 [(google.api.field_behavior) = REQUIRED];
  // Label for the run button.
  string run_button_label = 4 [(google.api.field_behavior) = OPTIONAL];
  // Form inputs the operator fills before submitting.
  repeated FormField inputs = 5 [(google.api.field_behavior) = OPTIONAL];
  // Optional post-LRO sync call that takes the LRO response and
  // returns the data to feed into `result`. For example
  // KnowledgeAssessmentService: Generate (LRO) → Assess (sync).
  RpcCall finalize = 6 [(google.api.field_behavior) = OPTIONAL];
  // Table-shaped result rendering. If `finalize` is set, this
  // describes the finalize response; otherwise the LRO response.
  TablePanel result = 7 [(google.api.field_behavior) = OPTIONAL];
}

message PanelDescriptor {
  // Stable identifier ("claims", "review_tickets", ...). Renderers
  // use this as the routing key and for telemetry.
  string panel_id = 1 [(google.api.field_behavior) = REQUIRED];
  // Display title shown at the top of the panel.
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  // Shape selector. Each variant has its own renderer.
  oneof body {
    // Fetch a list, render a table.
    TablePanel table = 3;
    // Long-running operation driver. (Reserved; renderer support
    // arrives alongside the first LRO migration.)
    LroPanel lro = 4;
    // Bespoke host-supplied layout (SPARQL editor, image viewer,
    // tree, etc.). The host looks up `adhoc.handler_id` in its own
    // registry and instantiates the corresponding hand-coded view.
    AdhocPanel adhoc = 5;
    // Standalone input/confirmation prompt. No RPC side effect;
    // values are returned to the in-process caller. Used by
    // CLI-shaped tools (e.g. rules_cloudformation's cfn_console)
    // that need to collect parameters or gate destructive actions
    // through meridian's design language.
    PromptPanel prompt = 6;
    // Author + parameter-fill UI for a templated LLM prompt
    // (Anthropic Messages, OpenAI Chat, etc.). Distinct from
    // PromptPanel: the slots are the inputs and the rendered
    // prompt is the output. Pair with LroPanel when the consumer
    // wants the renderer to also drive execution.
    LlmPromptPanel llm_prompt = 7;
    // Fetch a list, render a grid of clickable cards (e.g. an
    // integrations/connections gallery, a plugin catalog, a deck).
    GalleryPanel gallery = 8;
    // A form of fields — an entity "detail section". READONLY renders
    // a read-only card; EDIT renders an editable form. Distinct from
    // PromptPanel (which collects standalone input with no server
    // round-trip): FormPanel is the CRUD/detail surface bound to a
    // record, with a `submit` RPC in EDIT mode.
    FormPanel form = 9;
    // ── Content shapes (static, brand-neutral; no RpcCall/fetch) ──
    // Single-select among labeled options (web = segmented tabs, tui =
    // arrow-key list, chat = numbered).
    ChoicePanel choice = 10;
    // A copyable code artifact (web = <pre> + copy, tui = box + OSC52,
    // chat = fenced block).
    SnippetPanel snippet = 11;
    // An invocable affordance — a deep-link URI or a command (web =
    // button/link, tui = keybinding, chat = link).
    ActionPanel action = 12;
    // Composed "how any caller connects to a surface": a Choice of
    // targets, each yielding an Affordance + a Snippet.
    ConnectFlowPanel connect_flow = 13;
    // A labeled value with a copy affordance (web = pill/chip, tui =
    // text + copy key, chat = inline code).
    CopyValuePanel copy_value = 14;
    // A grid/list of authored items (web = cards, tui = list, chat =
    // bullets).
    CatalogPanel catalog = 15;
    // An interactive terminal over a pty WebSocket. WEB-SPECIFIC: only the
    // meridian-web renderer realizes it (xterm.js); the tui / web-react /
    // mui kits do not. Canonicalized here so a panel bundle can carry it.
    TerminalPanel terminal = 16;
    // A declarative rendering grammar (markdown / mermaid / plantuml / graphviz
    // / vega). Rendered per the surface's capabilities (content negotiation),
    // degrading to `alt` / source text where no transcoder matches. Rich render
    // is web; other modalities degrade. See grammar.proto.
    GrammarPanel grammar = 17;
    // A KPI / metric tile — a labeled number with a COMPUTED delta/trend and an
    // optional sparkline. A full-parity content shape (every modality). The
    // delta/trend is computed from `previous`/`series`, never author-marked. See
    // stat.proto.
    StatPanel stat = 18;
    // The header of a DETAIL view: a title + optional subtitle/status resolved
    // from the record, plus a strip of labeled descriptor rows. Fetches the
    // single record via `populate` (bound by the view's `subject_id`). Header
    // actions are carried on ViewDescriptor.actions (HEADER / OVERFLOW), not here.
    DetailHeaderPanel detail_header = 19;
    // A read-only key/value card for one record — the entity "detail section"
    // rendered as a labeled-value grid (NOT disabled inputs). Fetches the record
    // via `populate` (bound by the view's `subject_id`). This is the READONLY
    // detail surface; FormPanel(EDIT) remains for editable forms.
    RecordCardPanel record_card = 20;
    // An ordered walkthrough — steps a reader performs, each with an optional
    // narration, frame and actor. A full-parity content shape (every modality).
    // The step NUMBER is computed from position, never authored. For structured
    // walkthroughs (generated from a recording or a plan); hand-written prose
    // stays markdown under `grammar`. See steps.proto.
    StepsPanel steps = 21;
    // A video / audio / image with a poster, captions and chapters. A
    // SPECIALIZED visual panel (like terminal/grammar): a moving picture is not
    // displayable as text, so it degrades player → poster → `alt`. See
    // media.proto.
    MediaPanel media = 22;
    // An append-only stream of text lines (a build log, a deploy log, an agent
    // transcript) rendered as a following pane. A full-parity content shape:
    // only the LIVENESS degrades — a surface with no stream transport shows a
    // bounded snapshot, never a blank. Distinct from `terminal` (an interactive
    // pty, web-only) and from `table` (one bounded fetch). See stream.proto.
    StreamPanel stream = 23;
    ResourceCardPanel resource_cards = 24;
    // A portable chart intent. Hosts may render it natively or degrade to a
    // tabular/text representation when no chart capability is available.
    ChartPanel chart = 25;
  }
}

// The header of a DETAIL view. Renders the record's title prominently, an
// optional subtitle + status resolved from the record, and a strip of labeled
// descriptor rows. The record is fetched once via `populate`, with the detail
// subject id (ViewDescriptor.subject_id) bound into `id_field` of the request.
// Header-level actions live on ViewDescriptor.actions (HEADER / OVERFLOW).
message DetailHeaderPanel {
  // Resolved display title (static copy). When `title_source_path` is set and
  // resolves to a non-empty value, that wins over this literal.
  string title = 1 [(google.api.field_behavior) = OPTIONAL];
  // Dotted path into the fetched record for the title (e.g. "data.name").
  // Optional — falls back to `title`.
  string title_source_path = 2 [(google.api.field_behavior) = OPTIONAL];
  // Dotted path into the record for a subtitle line (e.g. "data.sponsor").
  string subtitle_source_path = 3 [(google.api.field_behavior) = OPTIONAL];
  // Dotted path into the record for a status value, rendered as a chip.
  string status_source_path = 4 [(google.api.field_behavior) = OPTIONAL];
  // Labeled descriptor rows shown under the title (label + a dotted source path).
  repeated DescriptorRow descriptor_rows = 5 [(google.api.field_behavior) = OPTIONAL];
  // RPC that fetches the single record. The renderer invokes it once with the
  // request field named by `id_field` set to the view's subject_id.
  RpcCall populate = 6 [(google.api.field_behavior) = OPTIONAL];
  // Request field the subject id binds to (default "id").
  string id_field = 7 [(google.api.field_behavior) = OPTIONAL];
}

// A read-only key/value card for one record. Each field renders as a labeled
// value read from the fetched record at the field's `field_id` (dotted path).
message RecordCardPanel {
  // Fields to display, in order. Reuses FormField for label/id/kind; the value
  // is read from the record at `field_id` (dotted path) and rendered read-only.
  repeated FormField fields = 1 [(google.api.field_behavior) = OPTIONAL];
  // RPC that fetches the single record (see DetailHeaderPanel.populate).
  RpcCall populate = 2 [(google.api.field_behavior) = OPTIONAL];
  // Request field the subject id binds to (default "id").
  string id_field = 3 [(google.api.field_behavior) = OPTIONAL];
  // Singular noun for labels / empty states (e.g. "product").
  string item_noun = 4 [(google.api.field_behavior) = OPTIONAL];
}

// One labeled descriptor row in a DetailHeaderPanel: a static label and a dotted
// path into the record for its value.
message DescriptorRow {
  // Display label (e.g. "Type", "Status").
  string label = 1 [(google.api.field_behavior) = REQUIRED];
  // Dotted path into the record for the value (e.g. "data.type").
  string source_path = 2 [(google.api.field_behavior) = REQUIRED];
  // How the value READS — the same shared spec a form field and a table cell use,
  // so one value reads the same on every surface.
  //
  // A header row is a labeled VALUE, which is exactly what ValueDisplay describes,
  // and it was the last read surface with no way to say so: a card field has
  // `FormField.display` and a cell has `TableColumn.value_display`, while these rows
  // could only be inferred from string shape. That is why a task's due date rendered
  // as a raw `2026-03-29T00:00:00.000Z` in the header while the card beside it read
  // "Mar 29, 2026" — same value, two code paths, only one of them declared.
  //
  // Unset ⇒ the renderer's existing inference, so every header emitted before this
  // is unaffected.
  ValueDisplay display = 3 [(google.api.field_behavior) = OPTIONAL];
}

// A form of fields bound to a record — the entity "detail section" /
// CRUD surface. In READONLY mode the renderer shows the fields as a
// read-only card (values come from the slot/panel's fetch); in EDIT
// mode it renders an editable form whose submit fires `submit`.
//
// Reuses the shared FormField input primitives (form.proto). The
// difference from PromptPanel is intent + binding: PromptPanel is a
// standalone input collector (no RPC side effect); FormPanel is a
// record-bound detail/edit view with a save RPC.
message FormPanel {
  // Fields to render, in display order.
  repeated FormField fields = 1 [(google.api.field_behavior) = REQUIRED];
  // READONLY (detail card) or EDIT (editable form).
  FormMode mode = 2 [(google.api.field_behavior) = OPTIONAL];
  // Save RPC fired on submit. Meaningful in EDIT mode; READONLY
  // panels are populated via the slot/panel fetch and set no submit.
  RpcCall submit = 3 [deprecated = true, (google.api.field_behavior) = OPTIONAL];
  // Singular noun for labels / empty states (e.g. "product").
  string item_noun = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional RPC that returns the initial field values for an EDIT form.
  // Renderers merge the response object into the field defaults before the
  // form becomes interactive; absent or failed prefill leaves defaults intact.
  RpcCall prefill = 5 [(google.api.field_behavior) = OPTIONAL];
  Affordance submit_affordance = 6;
}

// Render mode for a FormPanel.
enum FormMode {
  FORM_MODE_UNSPECIFIED = 0;
  // Read-only detail card.
  FORM_MODE_READONLY = 1;
  // Editable form with a submit action.
  FORM_MODE_EDIT = 2;
}

// A reload-friendly bundle of `PanelDescriptor`s authored as a single
// textproto, compiled to `.binpb` by the `meridian_panel_bundle`
// Bazel rule, and loaded by every renderer at startup.
//
// The host runtime watches the on-disk `.binpb` (dev workflow: edit
// textproto, save, see panels refresh) and re-publishes the parsed
// bundle to its renderer. In prod the same code path is driven by an
// admin RPC.
message PanelBundle {
  // Display version. Renderers log this on reload so changes are
  // observable in support sessions; the runtime does no semver work.
  string version = 1 [(google.api.field_behavior) = OPTIONAL];
  // Panels in display order. Renderers route to one of these by
  // matching `panel_id`.
  repeated PanelDescriptor panels = 2 [(google.api.field_behavior) = REQUIRED];
}

// Host-specific layout. The descriptor only names the handler; the
// host's adhoc registry supplies the implementation. Use this for
// bespoke views (code editors, tree views, image viewers) that the
// table/LRO shapes can't express cleanly.
message AdhocPanel {
  // Identifier the host looks up in its adhoc registry.
  string handler_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message StepsPanel {
  // The steps, in the order the reader performs them. Renderers number them from
  // this position — see the file comment; there is deliberately no ordinal field.
  repeated Step steps = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional lead-in prose shown above the first step (what the walkthrough
  // achieves, or what the reader needs before starting).
  string intro = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional closing prose shown after the last step (what the reader should now
  // see, or where to go next).
  string outro = 3 [(google.api.field_behavior) = OPTIONAL];
}

// One step of a walkthrough.
message Step {
  // The action, as an imperative the reader can follow ("Open the Sponsors
  // page"). The one field every modality renders.
  string label = 1 [(google.api.field_behavior) = REQUIRED];
  // Optional narration expanding on the label — what happens and why. One or two
  // sentences; renderers set it as body text under the label.
  string detail = 2 [(google.api.field_behavior) = OPTIONAL];
  // Optional URI of a frame illustrating this step (a screenshot, a diagram).
  // Enrichment only: surfaces that cannot display images omit it and fall back to
  // `media_alt`. Distinct from an icon key — this is a real image source.
  string media_uri = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional text alternative for `media_uri` — the accessible description, and
  // the degradation content on surfaces that cannot show the frame. Set it
  // whenever `media_uri` is set.
  string media_alt = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional actor performing this step, as a free label ("Admin", "User B").
  // Renderers derive a stable badge/color per distinct value. Set it on
  // multi-actor walkthroughs so a hand-off between people is legible.
  string actor = 5 [(google.api.field_behavior) = OPTIONAL];
  // Optional affordance for this step — a deep link into the surface the step
  // describes, or a command that performs it ("Open Sponsors").
  Affordance action = 6 [(google.api.field_behavior) = OPTIONAL];
}

message TablePanel {
  // RPC to call when this panel becomes active.
  RpcCall populate = 1 [(google.api.field_behavior) = REQUIRED];
  // Path within the response message to the row list. The named
  // field must be a `repeated` field; ProtoPaths resolves the chain
  // (e.g. "claims" or "outer.inner.rows").
  string rows_field = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional noun for the meta line ("claims", "tickets").
  string item_noun = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional placeholder displayed when the table is empty.
  string placeholder = 4 [(google.api.field_behavior) = OPTIONAL];
  // Column definitions in display order.
  repeated TableColumn columns = 5 [(google.api.field_behavior) = REQUIRED];
  // Actions exposed on the selected row (typically rendered as
  // buttons above the table).
  repeated RowAction actions = 6 [deprecated = true, (google.api.field_behavior) = OPTIONAL];
  // How the table pages. Absent ⇒ CLIENT (paginate the fetched rows in
  // the renderer) — backward compatible with pre-0.3.0 descriptors.
  Pagination pagination = 7 [(google.api.field_behavior) = OPTIONAL];
  AffordanceCollection affordances = 8;
}

// How a TablePanel paginates. CLIENT paginates the rows `populate` already
// returned (renderer-local, good for small lists). OFFSET and CURSOR re-invoke
// `populate` per page with renderer-supplied request fields, so they scale to
// large collections. Every renderer switches on `mode`; a renderer that can't
// page (e.g. a fixed-height TUI) may treat all modes as CLIENT.
message Pagination {
  // Paging strategy. Absent / UNSPECIFIED ⇒ CLIENT.
  PaginationMode mode = 1 [(google.api.field_behavior) = OPTIONAL];
  // Default rows per page. 0 ⇒ the renderer's own default.
  uint32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // OFFSET mode: request fields the renderer sets on `populate` when paging,
  // plus the response path to the total row count (for page count / "N of M").
  // Paths are dotted, like TableColumn.field_path (e.g. "page.offset").
  string offset_request_field = 3 [(google.api.field_behavior) = OPTIONAL];
  string limit_request_field = 4 [(google.api.field_behavior) = OPTIONAL];
  string total_field = 5 [(google.api.field_behavior) = OPTIONAL];

  // CURSOR mode (infinite scroll): request field carrying the cursor, plus the
  // response path to the next cursor (empty in a response ⇒ end of data).
  string cursor_request_field = 6 [(google.api.field_behavior) = OPTIONAL];
  string next_cursor_field = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Paging strategy for a Pagination.
enum PaginationMode {
  // Default; treated as CLIENT.
  PAGINATION_MODE_UNSPECIFIED = 0;
  // Paginate the rows already fetched by `populate`, in the renderer.
  PAGINATION_MODE_CLIENT = 1;
  // Server paging via offset/limit request fields + a total-count response.
  PAGINATION_MODE_OFFSET = 2;
  // Cursor / infinite scroll via a cursor request field + next-cursor response.
  PAGINATION_MODE_CURSOR = 3;
}

// One column in a TablePanel. Display order matches definition order.
message TableColumn {
  // Column header text.
  string header = 1 [(google.api.field_behavior) = REQUIRED];
  // Path within the row message, e.g. "confidence" or
  // "subject.claim.claim_text".
  string field_path = 2 [(google.api.field_behavior) = REQUIRED];
  // How to format the value for display.
  ColumnFormat format = 3 [(google.api.field_behavior) = OPTIONAL];
  // Hint for desktop / web renderers; TUI hosts may ignore.
  int32 pref_width = 4 [(google.api.field_behavior) = OPTIONAL];
  // Optional: render the cell as a link to a related entity. Present ⇒ the
  // renderer draws the value as a link and asks the host to resolve the
  // destination (meridian stays URL-agnostic — the host owns routes).
  ColumnLink link = 5 [(google.api.field_behavior) = OPTIONAL];
  // How the value reads — the shared spec a form field, a record card and a
  // detail-header row also use, so one value reads the same everywhere.
  //
  // ADDITIVE alongside `format` above, deliberately: `ColumnFormat` is the
  // table's own older six-case vocabulary, and replacing it outright would be a
  // breaking change for every consumer pinning the current schema. A renderer
  // PREFERS `value_display` when set and falls back to `format`, so existing
  // descriptors are byte-for-byte unaffected and tables migrate when convenient.
  // `ColumnFormat` should retire once they have.
  ValueDisplay value_display = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Renders a column's cell as a link navigating to a related entity. The
// renderer never builds a URL itself — it hands the host the target kind + the
// cell's value (the entity's id) and the host maps that to its own route (the
// `resolveHref` seam, the link peer of the icon / grammar host resolvers). A
// renderer with no host resolver draws plain text, never a dead link.
message ColumnLink {
  // The kind of entity the cell value identifies, e.g. "identity.user". Empty ⇒
  // the view's own subject kind (a self/detail link to this row's entity).
  string target_kind = 1 [(google.api.field_behavior) = OPTIONAL];
}

// One action button exposed on the row's actions bar.
message RowAction {
  // Button label.
  string label = 1 [(google.api.field_behavior) = REQUIRED];
  // RPC fired when the button is clicked.
  RpcCall rpc = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional: only enable the button when the selected row matches
  // this predicate (e.g. "only enable Resolve for OPEN tickets").
  RowFilter enabled_when = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional: re-fetch the table once the action completes. Default
  // true.
  bool refresh_on_success = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Predicate over a selected row. Today: equality on a single string
// field. Extensible to more operators later without breaking changes.
message RowFilter {
  // Path within the row, e.g. "state".
  string field_path = 1 [(google.api.field_behavior) = REQUIRED];
  // Stringified expected value. Compared via the value's renderable
  // form (enum name, formatted number, etc.).
  string equals = 2 [(google.api.field_behavior) = REQUIRED];
}

// How to format a column value before display. Renderers map each
// case to their native widget conventions.
enum ColumnFormat {
  // Default; render via Object.toString() / proto's default format.
  COLUMN_FORMAT_UNSPECIFIED = 0;
  // Plain string.
  STRING = 1;
  // Floating-point with two decimal places.
  FLOAT_2DP = 2;
  // Integer.
  INTEGER = 3;
  // Enum case name (e.g. "OPEN", "RESOLVED").
  ENUM_NAME = 4;
  // String list joined by ", ".
  STRING_LIST = 5;
  // google.protobuf.Timestamp rendered as ISO-8601.
  TIMESTAMP = 6;
}

message ViewDescriptor {
  // Stable identifier (the view key, e.g. "products-detail-view").
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Display title (resolved copy).
  string title = 2 [(google.api.field_behavior) = REQUIRED];
  // Route path this view is mounted at (optional).
  string route = 3 [(google.api.field_behavior) = OPTIONAL];
  // The entity/resource kind this view is about (optional).
  string subject_kind = 4 [(google.api.field_behavior) = OPTIONAL];
  // Whether the view is a list or a detail (drives default affordances).
  ViewKind kind = 5 [(google.api.field_behavior) = OPTIONAL];
  // The arrangement of the slots.
  Layout layout = 6 [(google.api.field_behavior) = REQUIRED];
  // The slots (panels + placement), in `position` order.
  repeated Slot slots = 7 [(google.api.field_behavior) = REQUIRED];
  // View-level (header) actions.
  repeated Action actions = 8 [deprecated = true, (google.api.field_behavior) = OPTIONAL];
  // For a DETAIL view: the id of the record this view is about. Detail panels
  // (detail_header / record_card) bind it into their `populate` request so the
  // renderer fetches the right record. Empty on LIST / non-entity views.
  string subject_id = 9 [(google.api.field_behavior) = OPTIONAL];
  AffordanceCollection affordances = 10;
}

// The kind of view.
enum ViewKind {
  VIEW_KIND_UNSPECIFIED = 0;
  // A list/collection of the subject kind.
  VIEW_KIND_LIST = 1;
  // A detail view of one record.
  VIEW_KIND_DETAIL = 2;
}

// The arrangement of a view's slots. A oneof so a renderer switches on the
// layout mode; each arm is a message so it can carry arm-specific options
// later without polluting Slot.
message Layout {
  oneof mode {
    // One content slot (a simple list page).
    ListLayout list = 1;
    // Slots stacked vertically by `position`.
    StackedLayout stacked = 2;
    // Slots rendered as tabs (see Placement.tab_label / tab_position).
    TabbedLayout tabbed = 3;
    // Two columns: main + sidebar (see Placement.column).
    TwoColumnLayout two_column = 4;
    // grid / master_detail: future, promoted via the corpus/crank ratchet.
  }
}

message ListLayout {}
message StackedLayout {}
message TabbedLayout {}
message TwoColumnLayout {}

// One slot in a view: a panel plus where it goes.
message Slot {
  // Slot name (e.g. "header", "content", "configuration").
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Semantic role hint (header | content | configuration | ...). Advisory;
  // the layout + placement drive actual positioning.
  string role = 2 [(google.api.field_behavior) = OPTIONAL];
  // Order within the layout.
  int32 position = 3 [(google.api.field_behavior) = OPTIONAL];
  // Optional slot-title override (else the panel's own title is used).
  string title = 4 [(google.api.field_behavior) = OPTIONAL];
  // Arrangement hints, interpreted per the view's Layout mode.
  Placement placement = 5 [(google.api.field_behavior) = OPTIONAL];
  // The panel rendered in this slot. Optional now that a slot may instead hold a
  // nested view (`sub_view`); exactly one of `panel` / `sub_view` is set.
  PanelDescriptor panel = 6 [(google.api.field_behavior) = OPTIONAL];
  // Slot-level (row) actions.
  repeated Action actions = 7 [deprecated = true, (google.api.field_behavior) = OPTIONAL];
  // A NESTED view rendered in this slot instead of a panel — meridian's
  // composition primitive: a slot may embed a whole ViewDescriptor (its own
  // layout + slots + panels), which the renderer draws recursively. Each nested
  // view is self-contained (its panels populate via their own RpcCalls). Enables
  // dashboards-of-views, entity detail sections, and any layout-in-a-layout. When
  // set, it takes precedence over `panel`.
  ViewDescriptor sub_view = 8 [(google.api.field_behavior) = OPTIONAL];
  // REPEAT the `sub_view` once per row — the composition primitive for a dynamic
  // list of rich items (a section per entity, a card-deck of detail views, …).
  // The renderer fetches `sub_view_populate`, resolves `sub_view_rows_field` to a
  // row list, and renders `sub_view` for EACH row with that row as the ambient
  // record. Panels inside the repeated sub_view with NO `populate` of their own
  // read from that record: a FormPanel/DetailHeaderPanel binds its fields to the
  // row, a TablePanel takes its rows from the row's `rows_field`. When
  // `sub_view_populate` is empty, `sub_view` renders once (static composition).
  RpcCall sub_view_populate = 9 [(google.api.field_behavior) = OPTIONAL];
  // Path within the `sub_view_populate` response to the row list (a `repeated`).
  string sub_view_rows_field = 10 [(google.api.field_behavior) = OPTIONAL];
  // Gate this slot on a SELECTION key (see FieldBinding.selection_key): while the
  // named key is unset in the view's selection bag, the renderer skips this slot's
  // panel entirely — no `populate` fires — and draws `depends_on_placeholder`
  // instead. A gated TAB still appears in the strip (its label is how the user
  // learns the section exists); only its body is replaced. Empty ⇒ ungated.
  string depends_on_selection_key = 11 [(google.api.field_behavior) = OPTIONAL];
  // Copy shown while the gate above is closed ("Select a plan year to view this
  // section."). Empty ⇒ the renderer's neutral default.
  string depends_on_placeholder = 12 [(google.api.field_behavior) = OPTIONAL];
  AffordanceCollection affordances = 13;
}

// Where a slot goes within its layout. Fields are interpreted by the active
// Layout mode (tab_* for TabbedLayout, column for TwoColumnLayout, ...).
message Placement {
  // Tab label (TabbedLayout).
  string tab_label = 1 [(google.api.field_behavior) = OPTIONAL];
  // Tab order (TabbedLayout).
  int32 tab_position = 2 [(google.api.field_behavior) = OPTIONAL];
  // Column (TwoColumnLayout).
  Column column = 3 [(google.api.field_behavior) = OPTIONAL];
  // Render inline in the header row rather than as its own section.
  bool header_row = 4 [(google.api.field_behavior) = OPTIONAL];
}

// A column in a TwoColumnLayout.
enum Column {
  COLUMN_UNSPECIFIED = 0;
  COLUMN_MAIN = 1;
  COLUMN_SIDEBAR = 2;
}

// A neutral action = a labeled RpcCall with a placement. Covers the host's
// row/header actions (edit / clone / delete / export / ...). The renderer draws
// the affordance; the host's RpcInvoker performs the call.
message Action {
  // Stable identifier (e.g. "edit", "delete").
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Display label.
  string label = 2 [(google.api.field_behavior) = REQUIRED];
  // The RPC this action fires.
  RpcCall call = 3 [(google.api.field_behavior) = OPTIONAL];
  // Where the affordance renders.
  ActionPlacement placement = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Where an action's affordance renders.
enum ActionPlacement {
  ACTION_PLACEMENT_UNSPECIFIED = 0;
  // A prominent primary button.
  ACTION_PLACEMENT_PRIMARY = 1;
  // Per-row action (list rows).
  ACTION_PLACEMENT_ROW = 2;
  // In the view/detail header.
  ACTION_PLACEMENT_HEADER = 3;
  // Collapsed into an overflow ("kebab") menu.
  ACTION_PLACEMENT_OVERFLOW = 4;
}

// Presence distinguishes an absent collection from an explicit empty override.
message AffordanceCollection { repeated Affordance items = 1; }
